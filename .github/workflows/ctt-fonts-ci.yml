name: CTT font reproduction

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ctt-fonts-ci.yml'
      - 'scripts/reproduce_fonts.py'
      - 'vendor-assets.json'
      - 'src/*font*.mjs'
      - 'docs/FONT-REPRODUCTION.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ctt-fonts-ci.yml'
      - 'scripts/reproduce_fonts.py'
      - 'vendor-assets.json'
      - 'src/*font*.mjs'
      - 'docs/FONT-REPRODUCTION.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'fonttools==4.61.1'
      - name: Fetch pinned font inputs
        shell: bash
        run: |
          curl --fail --location --retry 2 'https://archive.ubuntu.com/ubuntu/pool/main/f/fonts-dejavu/fonts-dejavu-core_2.37-8_all.deb' -o "$RUNNER_TEMP/ctt-dejavu.deb"
          curl --fail --location --retry 2 'https://raw.githubusercontent.com/google/fonts/b979dba422e445492b0eb9951ac52ee0b4d648c3/ofl/notoemoji/NotoEmoji%5Bwght%5D.ttf' -o "$RUNNER_TEMP/ctt-noto.ttf"
      - name: Verify inputs and reproduce every font module
        run: python scripts/reproduce_fonts.py --dejavu-deb "$RUNNER_TEMP/ctt-dejavu.deb" --noto-variable "$RUNNER_TEMP/ctt-noto.ttf"
      - run: python scripts/verify_vendor.py
