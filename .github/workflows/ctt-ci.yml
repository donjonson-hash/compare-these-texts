name: CTT

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Font and browser system packages can consume the former 15-minute budget.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install PDF and OCR fixture fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-urw-base35 fonts-dejavu-core
      - run: npm ci --ignore-scripts
      - name: Dependency advisory check
        run: npm audit --audit-level=high
      - run: npm test
      - run: npm run check
      - name: Install Chromium for extension onboarding checks
        run: npx playwright install --with-deps chromium
      - name: Check installed extension welcome and saved work
        run: npm run check:extension
        env:
          REQUIRE_EXTENSION: '1'
      - name: Check compact comparison workspace
        run: npm run check:compact
      - name: Generate synthetic OCR fixtures
        run: |
          python3 -m pip install Pillow==13.0.0 reportlab==4.4.9
          python3 experiments/ocr/generate_pdf_fixtures.py
      - name: Check reviewed OCR in the website and installed extension
        run: npm run check:ocr
      - name: Upload OCR browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctt-ocr-browser-${{ github.sha }}
          path: test-output/ocr-integration/
      - name: Capture current store images after UI checks
        run: npm run store:assets
      - run: npm run package:store
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compare-these-texts-${{ github.sha }}
          path: |
            dist/
            artifacts/
            test-output/compact/*.png
            test-output/encrypted-storage-check.json
          if-no-files-found: error
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Install WebKit and system dependencies
        run: npx playwright install --with-deps webkit
      - name: Check WebKit text highlights and saved OCR transitions
        run: node scripts/check_webkit_browser.mjs
      - name: Upload WebKit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctt-webkit-${{ github.sha }}
          path: test-output/webkit/
