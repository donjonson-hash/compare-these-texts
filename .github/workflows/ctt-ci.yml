name: CTT

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install standard PDF font fixtures
        run: sudo apt-get update && sudo apt-get install -y fonts-urw-base35
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: compare-these-texts-${{ github.sha }}
          path: dist/
          if-no-files-found: error
