name: Standalone Document Scanner
on:
  workflow_dispatch:
  push:
    branches: ['feat/standalone-document-scanner']
  pull_request:
    paths: ['standalone-scanner/**', 'src/ocr-*', 'src/session-*', 'src/pdf-*', 'scripts/build_ocr_assets.py', 'package*.json', '.github/workflows/document-scanner.yml']
permissions:
  contents: read
jobs:
  packaged-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python3 standalone-scanner/build.py
      - run: node --experimental-vm-modules --test standalone-scanner/tests/*.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: node standalone-scanner/check-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-scanner-0.1.0
          path: |
            standalone-scanner/artifacts/document-scanner-0.1.0.zip
            standalone-scanner/test-output/
