name: CTT Google Docs

on:
  pull_request:
    branches: [main]
    paths: ['google-docs/**', 'package.json', 'package-lock.json', '.github/workflows/ctt-google-docs-ci.yml']
  push:
    branches: [main]
    paths: ['google-docs/**', 'package.json', 'package-lock.json', '.github/workflows/ctt-google-docs-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Selection safety and sidebar tests
        run: node --test google-docs/tests/*.test.mjs
      - name: Package bound script
        run: python3 google-docs/build.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compare-these-texts-google-docs-prototype
          path: google-docs/dist/*.zip
          if-no-files-found: error
